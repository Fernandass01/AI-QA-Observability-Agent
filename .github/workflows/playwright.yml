name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test
        continue-on-error: true

      - name: Run AI failure analysis
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node failure-analysis/analyze-failure.js

      - name: Publish AI analysis summary
        if: always()
        run: node failure-analysis/generate-summary.js
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload AI failure data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: |
            failure-analysis/failures.json
            failure-analysis/analyses.json
          if-no-files-found: ignore
      - name: Fail workflow if Playwright tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1